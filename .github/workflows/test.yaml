---
name: Test

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write # packages.maestra.io (uv-nora)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # GitHub Releases through nora (packages.maestra.io): 3-day hold, issues-maestra#1649.
      # Bump the version and the sha256 (the release's asset digest) together.
      - name: Flux CLI through nora
        uses: maestra-io/github-actions/nora-asset@bce883a9462ae1a0ec95b02ac797f223589ef7a5 # v1.115.0
        with:
          path: github/fluxcd/flux2/releases/download/v2.10.1/flux_2.10.1_linux_amd64.tar.gz
          sha256: 967365ff84aabc97871827ff33713ef0c09f62dd83c18759e3a5e39adcea9285
          bin: flux
          member: flux
      # The helm-template snapshots match helm 3.x; the runner image's newer helm drops
      # `limits: null` and adds `port:`, so the Test job pins helm (red on main since 06.11).
      - name: Setup Helm
        uses: maestra-io/github-actions/setup-helm-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          version: v3.22.1
      - name: Install uv
        uses: maestra-io/github-actions/setup-uv-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "requirements_dev.txt"
          activate-environment: true
      - name: Python packages through nora
        uses: maestra-io/github-actions/uv-nora@67dad0867462692b62bf7e10d377b944ab68832f # v1.72.0
      - name: Install dependencies
        run: |
          uv pip install -r requirements_dev.txt
      - name: Test with pytest
        run: |
          SKIP_DIFF_TESTS=1 pytest --cov=flux_local --cov-report=term-missing --snapshot-warn-unused
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS,PYTHON
          # No CODECOV_TOKEN in our fork, and codecov refuses a tokenless upload.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          verbose: true
      - name: Test flux-local diff
        run: |
          pytest tests/tool/test_diff.py
