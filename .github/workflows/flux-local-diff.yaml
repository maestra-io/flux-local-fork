---
name: flux-local diff

on:
  push:
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # packages.maestra.io (uv-nora)
  pull-requests: write # PR Comments

jobs:
  diffs:
    name: Compute diffs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster_path:
        - tests/testdata/cluster
        - tests/testdata/cluster2
        - tests/testdata/cluster3
        - tests/testdata/cluster4
        - tests/testdata/cluster5
        - tests/testdata/cluster6
        - tests/testdata/cluster7
        resource:
        - helmrelease
        - kustomization
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    # GitHub Releases through nora (packages.maestra.io): 3-day hold, issues-maestra#1649.
    # Bump the version and the sha256 (the release's asset digest) together.
    - name: Flux CLI through nora
      uses: maestra-io/github-actions/nora-asset@bce883a9462ae1a0ec95b02ac797f223589ef7a5 # v1.115.0
      with:
        path: github/fluxcd/flux2/releases/download/v2.10.1/flux_2.10.1_linux_amd64.tar.gz
        sha256: 967365ff84aabc97871827ff33713ef0c09f62dd83c18759e3a5e39adcea9285
        bin: flux
        member: flux
    - name: Python packages through nora (the action installs flux-local with uv in this repo)
      uses: maestra-io/github-actions/uv-nora@67dad0867462692b62bf7e10d377b944ab68832f # v1.72.0
    - uses: ./action/diff
      id: diff
      with:
        path: ${{ matrix.cluster_path }}
        resource: ${{ matrix.resource }}
        debug: true
        sources: cluster=tests/testdata/cluster3,flux-system,home-ops-kubernetes
        api-versions: batch/v1/CronJob
    - name: PR Comments
      uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
      if: ${{ steps.diff.outputs.diff != '' }}
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        message-id: ${{ github.event.pull_request.number }}/${{ matrix.cluster_path }}/${{ matrix.resource }}
        message-failure: Unable to post kustomization diff
        message: |
          `````diff
          ${{ steps.diff.outputs.diff }}
          `````
