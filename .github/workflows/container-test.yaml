---
name: Container Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    if: ${{ github.event.pull_request.head.repo.full_name == 'allenporter/flux-local' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # GitHub OIDC token for nora (packages.maestra.io)
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: maestra-io/github-actions/setup-buildx@c2df9bd2e781bf963eb271843b91a90dc7193d77 # v1.86.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit secret PRIVATE_PACKAGES_TOKEN: the GitHub OIDC token nora takes for
      # packages in the build (issues-maestra#1649); it lives minutes, minted right before.
      - name: mint packages token
        id: nora
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('packages.maestra.io');
            core.setSecret(t);
            core.setOutput('token', t);
      - name: Build and Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          secrets: |
            PRIVATE_PACKAGES_TOKEN=${{ steps.nora.outputs.token }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
